<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Deadliest mountains</title>
</head>
<body>
    <main>
        <div class="passo ativo" id="passo-0">
            <p>Um dia desses, você se sentiu inspirado e decediu subir uma montanha alta e perigosa com seu amigo, em busca de uma conquista arriscada.</p>
            <button class="btn-proximo" data-proximo="1">K2</button>
            <button class="btn-proximo" data-proximo="2">Annapurna I</button>
        </div>
        <div class="passo" id="passo-1">
            <p>Você e seu amigo decidiram subir a Annapurna I, mesmo com o concentimento que ela e a montanha mais perigosa do mundo.</p>  
            <button class="btn-proximo" data-proximo="3">Seguir em frente e subirla</button>
            <button class="btn-proximo" data-proximo="4">Desistir e voltar atras</button>
        </div>
    </main>
    <script src="script.js"></script>
